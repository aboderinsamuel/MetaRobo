name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: App (types, lint, tests, benchmark)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes the benchmark: every ready-made robot runs its whole task in full physics, no API key.
      - run: npm test

  engine:
    name: C++ engine (native build and analytic checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S engine -B engine/build && cmake --build engine/build && ctest --test-dir engine/build --output-on-failure
